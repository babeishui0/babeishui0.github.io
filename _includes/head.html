{% include base_path %}

<meta charset="utf-8">

{% include seo.html %}

<link href="{% if site.atom_feed.path %}{{ site.atom_feed.path }}{% else %}{{ base_path }}/feed.xml{% endif %}" type="application/atom+xml" rel="alternate" title="{{ site.title }} Feed">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="preload" as="image" href="{{ '/images/mountain-background.jpg' | relative_url }}">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
  // Place the complete panel offscreen before its entrance can be painted.
  if (!location.hash && Element.prototype.animate && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.documentElement.classList.add('glass-entering');
    setTimeout(function () { document.documentElement.classList.remove('glass-entering'); }, 3000);
  }
  // Resolve the material palette before the first paint and navigation snapshot.
  (function () {
    try {
      var theme = localStorage.getItem('theme') || document.documentElement.getAttribute('data-theme');
      var dark = theme === 'dark' || ((!theme || theme === 'system') && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (dark) document.documentElement.setAttribute('data-theme', 'dark');
      else document.documentElement.removeAttribute('data-theme');
    } catch (error) { /* Keep the server-rendered theme if storage is unavailable. */ }
  })();
</script>


<!-- For all browsers -->
<link rel="stylesheet" href="{{ base_path }}/assets/css/main.css?v={{ site.time | date: '%Y%m%d%H%M%S' }}">
